[project]
name = "flamejob"
version = "0.0.1"
description = "flamejob — distributed hashcat job queue (Python 3.10+ port of nc-intezra/flamejob, Rust v2.2.0)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "pyjwt>=2.8",
    "argon2-cffi>=23.1",
    "cryptography>=42.0",
    "asyncpg>=0.29",
]

[project.optional-dependencies]
# Phases 1+ pull these in; kept out of the base install so Phase 0 is lean.
server = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "prometheus-client>=0.20", "ldap3>=2.9"]
agent = ["websockets>=12.0", "httpx>=0.27", "nvidia-ml-py>=12.535", "psutil>=5.9"]
tui = ["textual>=0.60"]
cli = ["typer>=0.12"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "mypy>=1.9",
    "ruff>=0.4",
    "httpx>=0.27",
    "testcontainers[postgres]>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/flamejob_core",
    "src/flamejob_api",
    "src/flamejob_db",
    "src/flamejob_server",
]

# ---- tooling ----
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "RUF"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency injectors are designed to be called in argument defaults.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Security",
]
# S101 (assert) and test-only subprocess/hardcoded-literal lints are fine in
# tests; keep SQL-injection lint (S608) loud everywhere.
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S603", "S607"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["flamejob_core", "flamejob_api", "flamejob_db", "flamejob_server"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["asyncpg", "asyncpg.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src", "tests"]
markers = [
    "interop: format-interop proofs against real Rust-generated fixtures",
    "postgres: needs a live Postgres (skipped when FLAMEJOB_TEST_DSN is unset)",
]
